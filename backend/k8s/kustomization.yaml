apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - secrets/circle-app-secret.yaml

secretGenerator:
  - name: circle-secret
    type: kubernetes.io/tls
    files:
      - tls.crt=secrets/tls.crt
      - tls.key=secrets/tls.key

resources:
  - secrets/circle-app-secret.yaml
