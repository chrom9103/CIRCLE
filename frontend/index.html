<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <!-- Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function(){
        try {
          function tryLoad(src) {
            var req = new XMLHttpRequest();
            req.open('GET', src, false); // synchronous on purpose to ensure env is loaded before app
            try {
              req.send(null);
            } catch (e) {
              return null;
            }
            if (req.status >= 200 && req.status < 300) return req.responseText;
            return null;
          }

          var code = tryLoad('/env.js');
          if (!code) code = tryLoad('/CIRCLE/env.js');
          if (code) {
            var s = document.createElement('script');
            s.text = code;
            document.head.appendChild(s);
          } else {
            console.warn('runtime env not found at /env.js or /CIRCLE/env.js');
          }
        } catch(e) {
          console.warn('failed to load runtime env:', e);
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
