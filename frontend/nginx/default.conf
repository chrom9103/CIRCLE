server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json|woff2?|ttf)$ {
    try_files $uri =404;
    access_log off;
    expires 30d;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /favicon.ico { log_not_found off; access_log off; }

  # Block access to runtime env files to avoid leaking secrets
  location = /env.js {
    return 404;
  }

  location = /CIRCLE/env.js {
    return 404;
  }

  # Serve app under /CIRCLE subpath
  location ^~ /CIRCLE/assets/ {
    alias /usr/share/nginx/html/CIRCLE/assets/;
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location ^~ /CIRCLE/ {
    alias /usr/share/nginx/html/CIRCLE/;
    try_files $uri $uri/ /CIRCLE/index.html;
  }

  location = /CIRCLE/favicon.ico {
    alias /usr/share/nginx/html/CIRCLE/favicon.ico;
    access_log off;
    log_not_found off;
  }
}