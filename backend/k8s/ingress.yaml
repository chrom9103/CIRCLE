apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: circle-ingress
spec:
  ingressClassName: public
  rules:
    - host: www.chrom.jp
      http:
        paths:
          - path: /CIRCLE
            pathType: Prefix
            backend:
              service:
                # Route to the frontend (nginx) service which serves the SPA
                name: circle-frontend-service
                port:
                  number: 80
          - path: /CIRCLE/assets
            pathType: Prefix
            backend:
              service:
                name: circle-frontend-service
                port:
                  number: 80
          - path: /CIRCLE/favicon.ico
            pathType: Prefix
            backend:
              service:
                name: circle-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: circle-backend-service
                port:
                  number: 8081
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: circle-backend-service
                port:
                  number: 8081
  tls:
    - hosts:
        - www.chrom.jp
      secretName: circle-secret