# 開発用オーバーライド設定（ホットリロード有効）
# docker compose up で自動的にマージされます

services:
  backend:
    volumes:
      # ソースコードをマウントしてホットリロードを有効化
      - ./backend:/app/backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]

  frontend:
    env_file:
          - ./frontend/.env.local
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend.dev
    volumes:
      # ソースコードをマウント
      - ./frontend:/app
      # node_modules はコンテナ内のものを使用（ホスト側を上書きしない）
      - /app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
